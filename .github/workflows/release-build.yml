name: Build and Upload miku-bpmn Skills ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing Release tag to receive the ZIP
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: miku-bpmn-release-${{ github.event.release.tag_name || inputs.tag_name }}

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

jobs:
  build-and-upload:
    if: startsWith(github.event.release.tag_name || inputs.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact Release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js for the build
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build the versioned ZIP
        id: archive
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          npm run build:bundle:zip
          zip_path="bundle/igapyon-miku-bpmn-skills-$version.zip"
          test -s "$zip_path"
          printf 'zip_path=%s\n' "$zip_path" >> "$GITHUB_OUTPUT"

      - name: Check the ZIP contents
        shell: bash
        env:
          ZIP_PATH: ${{ steps.archive.outputs.zip_path }}
        run: |
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          unzip -q "$ZIP_PATH" -d "$extracted"
          diff -qr skills/igapyon-miku-bpmn "$extracted/skills/igapyon-miku-bpmn"
          cmp README.md "$extracted/README.md"
          cmp LICENSE "$extracted/LICENSE"

      - name: Attach the checked ZIP to the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.archive.outputs.zip_path }}
        run: gh release upload "$RELEASE_TAG" "$ZIP_PATH" --repo "$GITHUB_REPOSITORY"
